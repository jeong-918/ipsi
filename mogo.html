<script>
'use strict';
(() => {
/* ================= 설정 ================= */
const APP_TITLE = '모의고사 성적 관리 허브';
const POLL_MS = 5000;
const KDF_ITER = 300000;
const ID_ITER = 120000;
const STUDENT_DIR = 'data/s';
const META_PATH = 'data/meta.json';
const SUBJECTS = [
  {k:'국어', max:100, c:'#2563eb'}, {k:'수학', max:100, c:'#dc2626'}, {k:'영어', max:100, c:'#16a34a'},
  {k:'한국사', max:50, c:'#9333ea'}, {k:'통합사회', max:50, c:'#ea580c'}, {k:'통합과학', max:50, c:'#0891b2'}
];
const ORGS = ['교육청','평가원','사설','기타'];
const TH_LOW = 70, TH_CRIT = 60, FREQ_RATIO = 0.7, DROP_PTS = 10;
const IDLE_MS = 25 * 60 * 1000;
const PRESETS = [['all','전체 기간'],['1m','최근 1개월'],['3m','최근 3개월'],['6m','최근 6개월'],['12m','최근 1년'],['custom','직접 지정']];

/* ================= 유틸 ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc = new TextEncoder(), dec = new TextDecoder();
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = () => ymd(new Date());
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const r1 = n => Math.round(n * 10) / 10;
const fmt = n => (n == null || Number.isNaN(n)) ? '—' : String(r1(n));
const SUBJ = Object.fromEntries(SUBJECTS.map(s => [s.k, s]));
const SUBJ_IDX = Object.fromEntries(SUBJECTS.map((s, i) => [s.k, i]));
const BASE = new URL('./', location.href);
class AppError extends Error {}
const b64e = u8 => { const a = new Uint8Array(u8); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const hex = u8 => [...new Uint8Array(u8)].map(b => b.toString(16).padStart(2, '0')).join('');
const rid = () => hex(crypto.getRandomValues(new Uint8Array(8)));
const rnd = n => crypto.getRandomValues(new Uint8Array(n));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
function genPw() {
  const al = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
  const r = rnd(12); let s = '';
  for (let i = 0; i < 12; i++) s += al[r[i] % al.length];
  return s;
}
function validDate(s) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d = new Date(s + 'T00:00:00');
  return !Number.isNaN(d.getTime()) && ymd(d) === s;
}
function normDate(s) {
  const m = String(s).trim().match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);
  return m ? `${m[1]}-${pad(m[2])}-${pad(m[3])}` : String(s).trim();
}
const gradeLabel = g => `고${g}`;

/* ================= 암호화 ================= */
const C = {
  async kdfKey(pw, salt, iter) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations: iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
  },
  async kdfId(phone, salt) {
    const base = await crypto.subtle.importKey('raw', enc.encode(phone), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations: ID_ITER, hash:'SHA-256'}, base, 128));
  },
  async seal(key, bytes) {
    const iv = rnd(12);
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, bytes);
    return {iv: b64e(iv), ct: b64e(ct)};
  },
  async open(key, o) {
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv: b64d(o.iv)}, key, b64d(o.ct)));
  },
  newDek() { return crypto.subtle.generateKey({name:'AES-GCM', length:256}, true, ['encrypt','decrypt']); },
  importDek(raw) { return crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, true, ['encrypt','decrypt']); },
  async exportDek(k) { return new Uint8Array(await crypto.subtle.exportKey('raw', k)); }
};
async function buildFile(dek, doc, kek, saltS, adminKey) {
  const raw = await C.exportDek(dek);
  const body = await C.seal(dek, enc.encode(JSON.stringify(doc)));
  return {v:1, salt: b64e(saltS), wS: await C.seal(kek, raw), wA: await C.seal(adminKey, raw), iv: body.iv, ct: body.ct};
}
async function resealFile(file, dek, doc) {
  const body = await C.seal(dek, enc.encode(JSON.stringify(doc)));
  return {...file, iv: body.iv, ct: body.ct};
}

/* ================= GitHub 클라이언트 (관리자 전용) ================= */
function ghMsg(s, rem) {
  if (s === 401) return 'GitHub 토큰이 유효하지 않거나 만료되었습니다.';
  if (s === 403 || s === 429) return rem === '0' ? 'GitHub API 요청 한도를 초과했습니다. 잠시 후 자동 재시도합니다.' : 'GitHub 접근이 거부되었습니다. 토큰 권한(Contents: Read and write)을 확인하세요.';
  if (s === 404) return '저장소 또는 파일을 찾을 수 없습니다. 저장소 정보와 토큰 권한을 확인하세요.';
  if (s === 409 || s === 422) return '동시 수정 충돌이 발생했습니다.';
  return `GitHub 오류(${s})`;
}
const GH = {
  cfg: {owner:'', repo:'', branch:''}, token: '', rate: null,
  root() { return `/repos/${encodeURIComponent(this.cfg.owner)}/${encodeURIComponent(this.cfg.repo)}`; },
  url(p) { return `${this.root()}/contents/${p.split('/').map(encodeURIComponent).join('/')}`; },
  q() { return this.cfg.branch ? `?ref=${encodeURIComponent(this.cfg.branch)}` : ''; },
  async req(method, path, body) {
    let r;
    try {
      r = await fetch('https://api.github.com' + path, {
        method, cache: 'no-cache',
        headers: {Authorization: 'Bearer ' + this.token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? {'Content-Type':'application/json'} : {})},
        body: body ? JSON.stringify(body) : undefined
      });
    } catch { const e = new Error('네트워크 연결을 확인해 주세요.'); e.net = true; throw e; }
    const rem = r.headers.get('x-ratelimit-remaining');
    if (rem !== null) this.rate = {remaining: +rem, limit: +r.headers.get('x-ratelimit-limit'), reset: +r.headers.get('x-ratelimit-reset')};
    if (r.status === 204) return null;
    let data = null; try { data = await r.json(); } catch {}
    if (!r.ok) {
      const e = new Error(ghMsg(r.status, rem)); e.status = r.status;
      e.rate = r.status === 429 || (r.status === 403 && rem === '0');
      e.conflict = r.status === 409 || r.status === 422; throw e;
    }
    return data;
  },
  repoInfo() { return this.req('GET', this.root()); },
  async list(dir) {
    try { const d = await this.req('GET', this.url(dir) + this.q()); return Array.isArray(d) ? d : []; }
    catch (e) { if (e.status === 404) return []; throw e; }
  },
  async getFile(p) {
    try {
      const d = await this.req('GET', this.url(p) + this.q());
      if (!d || d.type !== 'file') return null;
      return {sha: d.sha, text: dec.decode(b64d(String(d.content).replace(/\s/g, '')))};
    } catch (e) { if (e.status === 404) return null; throw e; }
  },
  async put(p, text, sha, msg) {
    const body = {message: msg, content: b64e(enc.encode(text))};
    if (sha) body.sha = sha;
    if (this.cfg.branch) body.branch = this.cfg.branch;
    const d = await this.req('PUT', this.url(p), body);
    return {sha: d.content.sha};
  },
  async del(p, sha, msg) {
    const body = {message: msg, sha};
    if (this.cfg.branch) body.branch = this.cfg.branch;
    await this.req('DELETE', this.url(p), body);
  }
};
function detectCfg() {
  const h = location.hostname, parts = location.pathname.split('/').filter(Boolean);
  if (h.endsWith('.github.io')) {
    const owner = h.split('.')[0];
    return {owner, repo: parts[0] && !parts[0].includes('.') ? parts[0] : `${owner}.github.io`, branch: ''};
  }
  return {owner:'', repo:'', branch:''};
}

/* ================= 공개 파일 읽기 (학생/메타) ================= */
async function loadMeta() {
  const r = await fetch(new URL(`${META_PATH}?_=${Date.now()}`, BASE), {cache:'no-store'});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`설정 파일을 불러오지 못했습니다(HTTP ${r.status}).`);
  return r.json();
}
async function fetchStudentText(sid) {
  const r = await fetch(new URL(`${STUDENT_DIR}/${sid}.json?_=${Date.now()}`, BASE), {cache:'no-store'});
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`데이터를 불러오지 못했습니다(HTTP ${r.status}).`);
  return r.text();
}

/* ================= 상태 ================= */
const ST = {
  role: null, tab: 'period', page: 'overview', sel: null, meta: null, metaErr: '', loginTab: 'student', loginErr: '',
  filter: {preset:'all', from:'', to:'', org:'all', mode:'session', subj:'국어', subjects: SUBJECTS.map(s => s.k)},
  sync: {state:'idle', at:null, msg:''}, modal: false, pending: false, after: [], csvPlan: null, seenBase: '', busy: false
};
let S = null;
const A = {key: null, idSalt: null, meta: null, students: new Map(), busy: 0};

/* ================= 동기화 ================= */
const Sync = {
  t: null, running: false, fn: null, pauseUntil: 0,
  start(fn) { this.stop(); this.fn = fn; this.t = setInterval(() => this.tick(), POLL_MS); },
  stop() { clearInterval(this.t); this.t = null; this.fn = null; this.running = false; },
  async tick() {
    if (this.running || !this.fn || document.hidden || Date.now() < this.pauseUntil) return;
    this.running = true;
    const fn = this.fn;
    try {
      const changed = await fn();
      if (fn === this.fn) { setStatus('ok'); if (changed) onDataChanged(); }
    } catch (e) {
      if (fn !== this.fn) return;
      if (e.rate) this.pauseUntil = Date.now() + 60000;
      if (e.status === 401) { logout('토큰이 유효하지 않아 로그아웃되었습니다.'); return; }
      setStatus('err', e.message || '동기화 오류');
    } finally { this.running = false; }
  }
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) Sync.tick(); });
function setStatus(state, msg = '') {
  ST.sync = {state, at: new Date(), msg};
  const el = $('#syncBox'); if (el) el.innerHTML = syncHTML();
}
function syncHTML() {
  const s = ST.sync, d = s.at;
  const t = d ? `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}` : '';
  const rate = ST.role === 'admin' && GH.rate ? ` · API ${GH.rate.remaining}/${GH.rate.limit}` : '';
  if (s.state === 'ok') return `<span class="dot ok"></span>동기화 ${t}${rate}`;
  if (s.state === 'err') return `<span class="dot err"></span>${esc(s.msg)}`;
  return '<span class="dot"></span>대기';
}
function onDataChanged() {
  if (ST.modal) { ST.pending = true; return; }
  render();
}

/* ================= 관리자 데이터 계층 ================= */
async function ingest(sid, sha, text) {
  try {
    const file = JSON.parse(text);
    const dek = await C.importDek(await C.open(A.key, file.wA));
    const doc = JSON.parse(dec.decode(await C.open(dek, file)));
    doc.exams = Array.isArray(doc.exams) ? doc.exams : [];
    doc.messages = Array.isArray(doc.messages) ? doc.messages : [];
    A.students.set(sid, {sid, sha, file, dek, doc});
  } catch { A.students.set(sid, {sid, sha, error: true}); }
}
async function adminSync() {
  if (A.busy > 0) return false;
  const list = await GH.list(STUDENT_DIR);
  const seen = new Set(); let changed = false;
  for (const it of list) {
    if (it.type !== 'file' || !it.name.endsWith('.json')) continue;
    const sid = it.name.slice(0, -5); seen.add(sid);
    const cur = A.students.get(sid);
    if (cur && cur.sha === it.sha) continue;
    if (cur && cur.wroteAt && Date.now() - cur.wroteAt < 12000) continue;
    const f = await GH.getFile(`${STUDENT_DIR}/${it.name}`);
    if (!f) continue;
    await ingest(sid, f.sha, f.text); changed = true;
  }
  if (A.busy > 0) return changed;
  for (const sid of [...A.students.keys()]) if (!seen.has(sid)) { A.students.delete(sid); changed = true; }
  return changed;
}
async function refreshOne(sid) {
  const f = await GH.getFile(`${STUDENT_DIR}/${sid}.json`);
  if (!f) { A.students.delete(sid); throw new AppError('학생 파일이 삭제되었습니다.'); }
  await ingest(sid, f.sha, f.text);
}
async function mutate(sid, fn) {
  for (let i = 0; i < 4; i++) {
    const cur = A.students.get(sid);
    if (!cur || cur.error) throw new AppError('학생 데이터를 찾을 수 없습니다.');
    const doc = structuredClone(cur.doc);
    fn(doc);
    doc.updatedAt = new Date().toISOString();
    const file = await resealFile(cur.file, cur.dek, doc);
    A.busy++;
    try {
      const res = await GH.put(`${STUDENT_DIR}/${sid}.json`, JSON.stringify(file), cur.sha, `update ${sid.slice(0, 8)}`);
      cur.doc = doc; cur.file = file; cur.sha = res.sha; cur.wroteAt = Date.now();
      return doc;
    } catch (e) {
      if (e.conflict && i < 3) { await refreshOne(sid); continue; }
      throw e;
    } finally { A.busy--; }
  }
}
function validateProfile(p) {

  if (!['문과', '이과'].includes(p.track)) throw new AppError('문/이과를 선택하세요.');

}

function upsertExam(doc, r) {
  doc.exams = doc.exams.filter(e => !(e.date === r.date && e.name === r.name && e.subject === r.subject));
  doc.exams.push({id: rid(), date: r.date, name: r.name, org: r.org, subject: r.subject, raw: r.raw, max: r.max, grade: r.grade ?? null, createdAt: new Date().toISOString()});
}

/* ================= 분석 ================= */
const pct = e => e.max > 0 ? e.raw / e.max * 100 : 0;
function periodRange(f) {
  if (f.preset === 'all') return {from:'0000-00-00', to:'9999-99-99'};
  if (f.preset === 'custom') return {from: f.from || '0000-00-00', to: f.to || '9999-99-99'};
  const m = {'1m':1, '3m':3, '6m':6, '12m':12}[f.preset] || 0;
  const d = new Date(); d.setMonth(d.getMonth() - m);
  return {from: ymd(d), to:'9999-99-99'};
}
function selectExams(doc, f) {
  const r = periodRange(f);
  return (doc.exams || []).filter(e => e.date >= r.from && e.date <= r.to && (f.org === 'all' || e.org === f.org));
}
function buildSessions(exams) {
  const m = new Map();
  for (const e of exams) {
    const k = e.date + '|' + e.name;
    if (!m.has(k)) m.set(k, {key: k, date: e.date, name: e.name, org: e.org, rec: {}});
    m.get(k).rec[e.subject] = e;
  }
  return [...m.values()].sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name, 'ko'));
}
function analyze(exams) {
  const sessions = buildSessions(exams), per = {};
  for (const sb of SUBJECTS) {
    const recs = sessions.map(s => s.rec[sb.k]).filter(Boolean);
    const ps = recs.map(pct), gs = recs.map(r => r.grade).filter(g => g != null);
    per[sb.k] = {
      count: recs.length, avg: ps.length ? mean(ps) : null, rawAvg: recs.length ? mean(recs.map(r => r.raw)) : null,
      max: ps.length ? Math.max(...ps) : null, min: ps.length ? Math.min(...ps) : null,
      last: ps.length ? ps[ps.length - 1] : null, prev: ps.length > 1 ? ps[ps.length - 2] : null,
      gradeAvg: gs.length ? mean(gs) : null
    };
  }
  const base = Math.max(0, ...SUBJECTS.map(s => per[s.k].count));
  const flags = {freq: [], improve: [], drop: []};
  if (base > 0) {
    for (const sb of SUBJECTS) {
      const p = per[sb.k];
      if (p.count < base * FREQ_RATIO) flags.freq.push({k: sb.k, count: p.count, base});
      if (p.avg !== null && p.avg < TH_LOW) flags.improve.push({k: sb.k, avg: p.avg, level: p.avg < TH_CRIT ? 'crit' : 'warn'});
      if (p.prev !== null && p.last - p.prev <= -DROP_PTS) flags.drop.push({k: sb.k, diff: p.last - p.prev});
    }
    flags.improve.sort((a, b) => a.avg - b.avg);
  }
  return {sessions, per, N: sessions.length, base, flags};
}
function diagHTML(an, only) {
  if (!an.N) return '';
  const pick = a => only ? a.filter(x => x.k === only) : a;
  const im = pick(an.flags.improve), fr = pick(an.flags.freq), dr = pick(an.flags.drop);
  const block = (title, cls, items) => items.length ? `<div class="dblock ${cls}"><h4>${title}</h4><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>` : '';
  let h = '';
  h += block('학습 개선 필요', 'danger', im.map(x => `<b>${esc(x.k)}</b>: 100점 환산 평균 ${fmt(x.avg)}점으로 기준(${TH_LOW}점)보다 ${fmt(TH_LOW - x.avg)}점 낮습니다.${x.level === 'crit' ? ' 집중 보강이 필요한 수준입니다.' : ''}`));
  h += block('응시 빈도 부족', 'warn', fr.map(x => `<b>${esc(x.k)}</b>: 최다 응시 과목은 ${x.base}회인데 ${x.count}회만 기록되어 있습니다. 응시 횟수가 부족해 성적 추이를 판단하기 어렵습니다.`));
  h += block('최근 하락 주의', 'info', dr.map(x => `<b>${esc(x.k)}</b>: 직전 회차 대비 ${fmt(Math.abs(x.diff))}점 하락했습니다.`));
  if (!h) h = `<div class="dblock okb"><h4>진단 결과</h4><p style="margin:0">${only ? esc(only) + ' 과목은' : '선택한 기간에는'} 평균 ${TH_LOW}점 미만이거나 응시 빈도가 부족한 항목이 없습니다.</p></div>`;
  return `<div class="diag">${h}</div>`;
}

    ${hasGrade ? '<div class="card"><h3>등급 추이</h3><div class="chart-box"><canvas id="cGrade"></canvas></div></div>' : ''}</div>`;
  const sessAvg = s => { const v = Object.values(s.rec).map(pct); return v.length > 1 ? mean(v) : null; };
  h += `<div class="card"><h3>회차별 기록</h3><div class="table-wrap"><table><thead><tr><th>날짜</th><th>모의고사</th><th>시행처</th><th class="n">원점수</th><th class="n">환산</th><th class="n">등급</th><th class="n">회차 평균 대비</th></tr></thead><tbody>${[...ss].reverse().map(s => {
    const r = s.rec[k], sa = sessAvg(s), d = sa === null ? null : pct(r) - sa;
    return `<tr><td>${esc(s.date)}</td><td>${esc(s.name)}</td><td>${esc(r.org)}</td><td class="n">${r.raw} / ${r.max}</td><td class="n ${pct(r) < TH_LOW ? 'low' : ''}">${fmt(pct(r))}</td><td class="n">${r.grade ?? '—'}</td><td class="n">${d === null ? '—' : (d >= 0 ? '+' : '') + fmt(d)}</td></tr>`;
  }).join('')}</tbody></table></div></div>`;
  ST.after.push(() => {
    const labels = ss.map(sessLabel);
    Charts.make('cSubj', {type: 'line', data: {labels, datasets: [
      {label: k, data: ss.map(s => r1(pct(s.rec[k]))), borderColor: sb.c, backgroundColor: sb.c, tension: .25, pointRadius: 5, borderWidth: 2.5},
      {label: '회차 전과목 평균', data: ss.map(s => { const a = sessAvg(s); return a === null ? null : r1(a); }), borderColor: '#64748b', borderDash: [4, 4], pointRadius: 2, borderWidth: 1.5, spanGaps: true},
      {label: `기준 ${TH_LOW}점`, data: labels.map(() => TH_LOW), borderColor: '#cbd5e1', borderDash: [6, 4], pointRadius: 0, borderWidth: 1.5}
    ]}, options: lineOpts({plugins: {tooltip: {callbacks: {afterLabel: c => { if (c.datasetIndex !== 0) return ''; const r = ss[c.dataIndex].rec[k]; return `원점수 ${r.raw}/${r.max}${r.grade != null ? ' · ' + r.grade + '등급' : ''}`; }}}}})});
    if (hasGrade) Charts.make('cGrade', {type: 'line', data: {labels, datasets: [{label: `${k} 등급`, data: ss.map(s => s.rec[k].grade ?? null), borderColor: sb.c, backgroundColor: sb.c, pointRadius: 5, tension: .2, spanGaps: true}]},
      options: {responsive: true, maintainAspectRatio: false, animation: false, plugins: {legend: {display: false}}, scales: {y: {reverse: true, min: 1, max: 9, ticks: {stepSize: 1}, title: {display: true, text: '등급(낮을수록 우수)'}}}}});
  });
  return h;
}

/* ================= 관리자 페이지 ================= */
function pageOverview() {
  const f = ST.filter, list = adminList();
  const rows = list.map(s => ({s, an: analyze(selectExams(s.doc, f))}));
  const errs = [...A.students.values()].filter(s => s.error).length;
  const totalRec = rows.reduce((a, r) => a + r.an.sessions.reduce((x, y) => x + Object.keys(y.rec).length, 0), 0);
  const warnCnt = rows.filter(r => r.an.flags.improve.length || r.an.flags.freq.length).length;
  let h = toolbar(false, false).replace('<span class="spacer"></span>', '<span class="spacer"></span><button class="btn" data-act="print">PDF 출력</button><button class="btn pri" data-act="addStudent">+ 학생 추가</button>');
  h = `<div class="print-only phead"><h1>${APP_TITLE} · 전체 현황</h1><div>기간 필터: ${PRESETS.find(x => x[0] === f.preset)[1]} · 시행처: ${f.org === 'all' ? '전체' : esc(f.org)} · 출력일 ${todayStr()}</div></div>` + h;
  if (errs) h += `<div class="err-box">복호화할 수 없는 학생 파일 ${errs}건이 있습니다(관리자 비밀번호 불일치 또는 파일 손상).</div>`;
  h += `<div class="grid3"><div class="stat"><div class="l">등록 학생</div><div class="v">${list.length}</div></div><div class="stat"><div class="l">기간 내 기록 수</div><div class="v">${totalRec}</div></div><div class="stat"><div class="l">주의 학생</div><div class="v ${warnCnt ? 'low' : ''}">${warnCnt}</div></div></div>`;
  if (!list.length) return h + '<div class="card empty">등록된 학생이 없습니다. “+ 학생 추가”로 시작하세요.</div>';
  h += `<div class="card"><h3>학생별 현황 <span class="hint">(과목 평균: 100점 환산 · 70점 미만 빨강)</span></h3><div class="table-wrap"><table><thead><tr><th>이름</th><th>학년</th><th>계열</th><th class="n">회차</th>${SUBJECTS.map(s => `<th class="n">${esc(s.k)}</th>`).join('')}<th>진단</th></tr></thead><tbody>${rows.map(({s, an}) => `<tr class="click" data-act="openStudent" data-sid="${esc(s.sid)}"><td><b>${esc(s.doc.profile.name)}</b></td><td>${gradeLabel(s.doc.profile.grade)}</td><td>${esc(s.doc.profile.track)}</td><td class="n">${an.N}</td>${SUBJECTS.map(sb => { const a = an.per[sb.k].avg; return `<td class="n ${a !== null && a < TH_LOW ? 'low' : ''}">${fmt(a)}</td>`; }).join('')}<td>${an.flags.improve.length ? `<span class="tag bad">개선 ${an.flags.improve.length}</span>` : ''}${an.flags.freq.length ? `<span class="tag warn">빈도 ${an.flags.freq.length}</span>` : ''}${an.N && !an.flags.improve.length && !an.flags.freq.length ? '<span class="tag ok">양호</span>' : ''}</td></tr>`).join('')}</tbody></table></div></div>`;
  h += `<div class="card"><h3>과목별 평균 (학생 평균의 평균)</h3><div class="chart-box"><canvas id="cClass"></canvas></div></div>`;
  ST.after.push(() => {
    const avgOf = (grp, k) => { const v = grp.map(r => r.an.per[k].avg).filter(x => x !== null); return v.length ? r1(mean(v)) : null; };
    const grp = {'전체': rows, '문과': rows.filter(r => r.s.doc.profile.track === '문과'), '이과': rows.filter(r => r.s.doc.profile.track === '이과')};
    const col = {'전체': '#2563eb', '문과': '#f59e0b', '이과': '#16a34a'};
    Charts.make('cClass', {type: 'bar', data: {labels: SUBJECTS.map(s => s.k), datasets: Object.keys(grp).map(g => ({label: g, data: SUBJECTS.map(s => avgOf(grp[g], s.k)), backgroundColor: col[g]}))}, options: {responsive: true, maintainAspectRatio: false, animation: false, plugins: {legend: {position: 'bottom'}}, scales: {y: {min: 0, max: 100}}}});
  });
  return h;
}
function pageImport() {

/* ================= 렌더링 ================= */
function unreadCount() {
  if (!S) return 0;
  const seen = store.get('mgh.seen.' + S.sid) || '';
  return (S.doc.messages || []).filter(m => m.at > seen).length;
}
function markSeen() {
  if (!S) return;
  const last = (S.doc.messages || []).reduce((a, m) => m.at > a ? m.at : a, '');
  if (last) store.set('mgh.seen.' + S.sid, last);
}
function tabsHTML(list) {
  return `<nav class="tabs no-print">${list.map(([k, l, b]) => `<button class="tab ${k === ST.tab ? 'on' : ''}" data-act="tab" data-k="${k}">${l}${b ? `<span class="badge-n">${b}</span>` : ''}</button>`).join('')}</nav>`;
}
function headerHTML(who) {
  return `<header class="top no-print"><div class="brand">${APP_TITLE}</div><div class="spacer"></div><span id="syncBox" class="sync">${syncHTML()}</span><span class="who">${esc(who)}</span><button class="btn ghost sm" data-act="logout">로그아웃</button></header>`;
}
function tabBody(doc, ctx) {
  switch (ST.tab) {
    case 'subject': return viewSubject(doc, ctx);
    case 'records': return viewRecords(doc, ctx);
    case 'messages': return viewMessages(doc, ctx);
    case 'manage': return ctx.admin ? viewManage(doc, ctx.sid) : '';
    default: return viewPeriod(doc, ctx);
  }
}
function render() {
  const y = window.scrollY;
  Charts.clear(); ST.after = [];
  const root = $('#app');
  try {
    if (!ST.role) root.innerHTML = loginHTML();
    else if (ST.role === 'student') {
      if (ST.tab === 'messages') markSeen();
      const p = S.doc.profile, un = unreadCount();
      root.innerHTML = headerHTML(`${p.name} · ${gradeLabel(p.grade)} · ${p.track}`) + `<main class="wrap" id="view">${tabsHTML([['period', '기간별'], ['subject', '과목별'], ['records', '기록'], ['messages', '메시지', ST.tab === 'messages' ? 0 : un]])}${tabBody(S.doc, {admin: false})}</main>`;
    } else {
      let body;
      const cur = ST.sel ? A.students.get(ST.sel) : null;
      if (ST.sel && cur && !cur.error) {
        const p = cur.doc.profile;
        body = `<div class="toolbar no-print"><button class="btn" data-act="back">← 목록</button><h2>${esc(p.name)}</h2><span class="tag">${gradeLabel(p.grade)}</span><span class="tag">${esc(p.track)}</span><span class="tag gray">${esc(p.phone)}</span></div>${tabsHTML([['period', '기간별'], ['subject', '과목별'], ['records', '기록'], ['messages', '메시지'], ['manage', '관리']])}${tabBody(cur.doc, {admin: true, sid: ST.sel})}`;
      } else {
        ST.sel = null;
        const pg = [['overview', '전체 현황'], ['import', 'CSV 일괄 입력'], ['settings', '설정·백업']];
        body = `<nav class="tabs no-print">${pg.map(([k, l]) => `<button class="tab ${ST.page === k ? 'on' : ''}" data-act="page" data-k="${k}">${l}</button>`).join('')}</nav>` + (ST.page === 'import' ? pageImport() : ST.page === 'settings' ? pageSettings() : pageOverview());
      }
      root.innerHTML = headerHTML('관리자') + `<main class="wrap" id="view">${body}</main>`;
    }
    ST.after.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
    const fi = $('#csvFile'); if (fi) fi.addEventListener('change', onCsvFile);
  } catch (e) {
    console.error(e);
    root.innerHTML = `<div class="wrap"><div class="err-box">화면을 표시하는 중 오류가 발생했습니다: ${esc(e.message)}<br><button class="btn" onclick="location.reload()">새로고침</button></div></div>`;
  }
  window.scrollTo(0, y);
}

/* ================= CSV ================= */
function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const delim = text.includes('\t') && !text.includes(',') ? '\t' : ',';
  const rows = []; let row = [], cur = '', q = false;
  const push = () => { row.push(cur); cur = ''; if (row.some(x => x.trim() !== '')) rows.push(row.map(x => x.trim())); row = []; };
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; push(); }
    else cur += c;
  }
  push();
  return rows;
}
function planCsv(text) {
  const rows = parseCSV(text), ok = [], errors = [];
  const students = adminList();
  rows.forEach((r, i) => {
    const line = i + 1;
    if (i === 0 && r[0] === '이름') return;
    const [name, d, exam, org, subject, rawS, gradeS, phone] = r;
    const fail = msg => errors.push({line, msg});
    if (!name) return fail('이름이 비어 있습니다.');
    let cands = students.filter(s => s.doc.profile.name === name);
    if (phone) cands = cands.filter(s => s.doc.profile.phone === phone.replace(/\D/g, ''));
    if (!cands.length) return fail(`학생 “${name}”을(를) 찾을 수 없습니다.`);
    if (cands.length > 1) return fail(`동명이인 “${name}” — 전화번호 열을 입력하세요.`);
    const date = normDate(d || '');
    if (!validDate(date)) return fail('날짜 형식이 올바르지 않습니다(YYYY-MM-DD).');
    if (!exam || exam.length > 40) return fail('모의고사명은 1~40자로 입력하세요.');
    const o = org || '기타';
    if (!ORGS.includes(o)) return fail(`시행처는 ${ORGS.join('/')} 중 하나여야 합니다.`);
    if (!SUBJ[subject]) return fail(`알 수 없는 과목: ${subject || '(빈 값)'}`);
    const raw = Number(rawS), max = SUBJ[subject].max;
    if (rawS === '' || rawS == null || Number.isNaN(raw) || raw < 0 || raw > max) return fail(`원점수는 0~${max} 사이 숫자여야 합니다.`);
    let grade = null;
    if (gradeS !== undefined && gradeS !== '') { grade = Number(gradeS); if (!Number.isInteger(grade) || grade < 1 || grade > 9) return fail('등급은 1~9 정수여야 합니다.'); }
    ok.push({sid: cands[0].sid, date, name: exam, org: o, subject, raw, max, grade});
  });
  return {raw: text, ok, errors};
}
function csvEscape(v) { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function csvOf(list) {
  const out = [['이름', '날짜', '모의고사명', '시행처', '과목', '원점수', '등급', '전화번호']];
  for (const s of list) for (const e of [...s.doc.exams].sort((a, b) => a.date.localeCompare(b.date)))
    out.push([s.doc.profile.name, e.date, e.name, e.org, e.subject, e.raw, e.grade ?? '', s.doc.profile.phone]);
  return out.map(r => r.map(csvEscape).join(',')).join('\r\n');
}
function download(name, text) {
  const b = new Blob(['\uFEFF' + text], {type: 'text/csv;charset=utf-8'});
  const u = URL.createObjectURL(b), a = document.createElement('a');
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}
function onCsvFile(e) {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  if (file.size > 2 * 1024 * 1024) { toast('파일이 너무 큽니다(2MB 이하).', 'err'); return; }
  const rd = new FileReader();
  rd.onload = () => { ST.csvPlan = planCsv(String(rd.result)); render(); };
  rd.onerror = () => toast('파일을 읽지 못했습니다.', 'err');
  rd.readAsText(file, 'utf-8');
}

      if (Number.isNaN(raw) || raw < 0 || raw > max) throw new AppError(`${s.k}: 원점수는 0~${max} 사이여야 합니다.`);
      let grade = null;
      if (gS !== '') { grade = Number(gS); if (!Number.isInteger(grade) || grade < 1 || grade > 9) throw new AppError(`${s.k}: 등급은 1~9 정수여야 합니다.`); }
      rows.push({date, name, org, subject: s.k, raw, max, grade});
    });
    if (!rows.length) throw new AppError('최소 한 과목의 점수를 입력하세요.');
    await mutate(sid, d => {
      if (od && on) d.exams = d.exams.filter(e => !(e.date === od && e.name === on));
      rows.forEach(r => upsertExam(d, r));
    });
    closeModal(); toast('저장했습니다.', 'ok'); render();
  },
  async sendMsg(fd) {
    const text = String(fd.get('text') || '').trim();
    if (!text) throw new AppError('메시지를 입력하세요.');
    if (text.length > 1000) throw new AppError('메시지는 1000자 이하로 입력하세요.');
    await mutate(ST.sel, d => { d.messages.push({id: rid(), at: new Date().toISOString(), text}); });
    toast('전송했습니다.', 'ok'); render();
  },
  async profile(fd) {
    const c = curAdminStudent();
    const p = {name: fd.get('name'), phone: String(fd.get('phone') || '').replace(/\D/g, ''), grade: fd.get('grade'), track: fd.get('track')};
    const pw = String(fd.get('pw') || '');
    const changed = p.phone !== c.doc.profile.phone;
    const nsid = await updateProfile(ST.sel, p, pw);
    ST.sel = nsid; toast('저장했습니다.', 'ok');
    if (changed) showCred('전화번호 변경 완료', p.phone, pw);
    render();
  },
  async resetPw(fd) {
    const c = curAdminStudent(), pw = String(fd.get('pw') || '');
    await resetPassword(ST.sel, pw);
    showCred('비밀번호 재설정 완료', c.doc.profile.phone, pw);
  },
  csvPreview(fd) {
    const t = String(fd.get('csv') || '');
    if (!t.trim()) throw new AppError('데이터를 붙여넣으세요.');
    ST.csvPlan = planCsv(t); render();
  },
  repoCfg(fd) {
    const cfg = readCfg(fd); GH.cfg = cfg; store.set('mgh.cfg', cfg); toast('저장했습니다. 다음 동기화부터 적용됩니다.', 'ok');
  },
  async token(fd) {
    const t = String(fd.get('token') || '').trim(); if (!t) throw new AppError('토큰을 입력하세요.');
    const old = GH.token; GH.token = t;
    try { await GH.repoInfo(); } catch (e) { GH.token = old; throw e; }
    store.set('mgh.tok', await C.seal(A.key, enc.encode(t))); toast('토큰을 교체했습니다.', 'ok');
  }
};
document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  const fn = FORM[form.dataset.form]; if (!fn) return;
  const btn = form.querySelector('button[type=submit]'); if (btn) btn.disabled = true;
  try { await fn(new FormData(form)); }
  catch (err) {
    console.error(err);
    if (!ST.role && !ST.modal) { ST.loginErr = err.message || '오류가 발생했습니다.'; render(); } else toast(err.message || '오류가 발생했습니다.', 'err');
  } finally { if (btn) btn.disabled = false; }
});

/* ================= 부팅 ================= */
async function bootMeta() {
  ST.metaErr = '';
  try { ST.meta = await loadMeta(); }
  catch (e) { ST.meta = null; ST.metaErr = e.message || '설정을 불러오지 못했습니다.'; }
}
async function boot() {
  if (!window.crypto || !crypto.subtle) {
    $('#app').innerHTML = '<div class="wrap"><div class="err-box">이 브라우저(또는 http 환경)에서는 암호화 기능을 사용할 수 없습니다. https 주소(GitHub Pages)로 접속하세요.</div></div>'; return;
  }
  GH.cfg = store.get('mgh.cfg') || detectCfg();
  $('#app').innerHTML = '<div class="login-wrap"><div class="login card empty">불러오는 중…</div></div>';
  await bootMeta(); render();
}
if (typeof __TEST__ !== 'undefined') window.__T = {C, analyze, planCsv, parseCSV, selectExams, buildSessions, ST, A, GH, createStudent, mutate, FORM, render, viewPeriod, viewSubject, viewRecords, pageOverview, setS: v => { S = v; }, upsertExam, ingest};
else boot();
})();
</script>
